name: Auto Spotless
on:
  workflow_dispatch:
  # push:
  #   branches: ['**']

permissions: { contents: write }

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: ./gradlew spotlessApply

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. ONLY stage the exact source files Spotless targets.
          # Running them on separate lines with '|| true' ensures that if 
          # a certain file type wasn't modified, it won't crash the script.
          git add -u -- '*.kt' 2>/dev/null || true
          git add -u -- '*.kts' 2>/dev/null || true
          git add -u -- '*.xml' 2>/dev/null || true
          
          # 2. Check if any formatting changes were actually staged
          git diff --cached --quiet && exit 0
          
          # 3. Commit and push strictly to the active branch
          git commit -m "Apply Spotless formatting"
          git push origin HEAD
          
